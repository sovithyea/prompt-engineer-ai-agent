<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prompt Polish Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        max-width: 420px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 4px;
      }
      p.hint {
        font-size: 11px;
        color: #666;
      }
      label {
        display: block;
        font-size: 14px;
        margin-bottom: 4px;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 8px;
        font-family: monospace;
      }
      button {
        padding: 8px 14px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        background: #d97757;
        color: #fff;
        cursor: pointer;
      }
      .status {
        font-size: 11px;
        margin-top: 8px;
        color: #555;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Prompt Polish — Settings</h1>
    <p class="hint">
      Your key is stored locally in this browser only (chrome.storage.local) and is sent directly to
      api.anthropic.com when you use the enhance button. It is never sent anywhere else.
    </p>
    <label for="api-key">Anthropic API key</label>
    <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <button id="save">Save</button>
    <div class="status" id="status"></div>
    <script src="index.js"></script>
  </body>
</html>
